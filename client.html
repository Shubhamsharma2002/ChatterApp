<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatt->App</title>
    <link rel="stylesheet" href="client.css">
</head>
<body>
     <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  
    <div class="chat-container">
        <div id="message-list" class="message-list">

        </div>
        <div class="input-are">
            <input type="text" id="message-input" class="input-msg" placeholder="Type something.." required>
            <input type="submit" id="send-message" value="Send">
        </div>
        
    </div>

    

     <script>
        const socket = io.connect('http://localhost:3000');

        const userName = prompt("Enter your name..");
        socket.emit("join", userName);

        const messageInput = document.getElementById("message-input");
        const messagelist = document.getElementById("message-list");
        const sendButton = document.getElementById("send-message");

        sendButton.addEventListener("click", function (){
            // console.log("send button clicked")


            const message = messageInput.value;
            console.log(message);
            if(message){
                socket.emit('new-message',message);
                const messageElement = document.createElement("div");
                messageElement.innerText = userName+ " "+ message;
                messagelist.appendChild(messageElement);
                messageInput.value = " ";
            }
        })
        socket.on('load_message', (messages) =>{
        messages.forEach(message => {
            const messageElement = document.createElement("div");
            messageElement.innerText =message.username+" "+message.message;
            messagelist.appendChild(messageElement);
        });
    })
        // listining the broadcast message and add to list
         socket.on('broadcast_message', (userMessage) =>{
            const messageElement = document.createElement("div");
            messageElement.innerText =userMessage.userName+" "+userMessage.message;
            messagelist.appendChild(messageElement);
         })
</script>
</body>
</html>
